manage-package-manager-versions: false

packages:
  - packages/*
  - examples/*
  - examples/tools/*
  - benches
  - .config/*

catalog:
  '@react-three/drei': ^10.7.7
  '@react-three/fiber': ^9.7.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/three': ^0.185.3
  directed: ^0.1.6
  mitata: ^1.0.34
  react: ^19.2.8
  react-dom: ^19.2.8
  three: ^0.185.1
  unplugin-inline-functions: ^0.4.2
  vite: ^8.2.0
  vitest: ^4.1.10

pmOnFail: download

allowBuilds:
  '@swc/core': true
  esbuild: true

onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - prettier@3.9.4
  - vite@8.1.2

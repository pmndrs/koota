manage-package-manager-versions: false

packages:
  - packages/*
  - examples/*
  - examples/tools/*
  - benches
  - .config/*

catalog:
  '@pmndrs/labs': ^0.11.0
  '@react-three/drei': ^10.7.9
  '@react-three/fiber': ^9.8.2
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@testing-library/react': ^16.3.3
  '@testing-library/svelte': ^5.4.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/three': ^0.186.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitejs/plugin-react-swc': ^4.3.3
  directed: ^0.1.6
  jsdom: ^30.1.3
  mitata: ^1.0.34
  react: ^19.3.1
  react-dom: ^19.3.1
  svelte: ^5.57.3
  three: ^0.186.1
  typescript: 7.0.2
  unplugin-inline-functions: ^0.4.2
  vite: ^8.3.5
  vitest: ^5.0.5

catalogs:
  peers:
    '@types/react': '>=18.0.0'
    react: '>=18.0.0'
    svelte: '>=5.0.0'
  typescript6:
    typescript: ^6.0.3

pmOnFail: download

allowBuilds:
  '@swc/core': true
  esbuild: true

onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - '@pmndrs/labs@0.11.0'
  - prettier@3.9.4
  - vite@8.1.2

manage-package-manager-versions: true

packages:
  - packages/*
  - examples/*
  - examples/tools/*
  - benches
  - .config/*

catalog:
  '@react-three/drei': ^10.7.7
  '@react-three/fiber': ^9.6.1
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@types/three': ^0.185.0
  directed: ^0.1.6
  mitata: ^1.0.34
  react: ^19.2.7
  react-dom: ^19.2.7
  three: ^0.181.2
  unplugin-inline-functions: ^0.4.2
  vite: ^8.1.2
  vitest: ^4.1.9

pmOnFail: download

allowBuilds:
  '@swc/core': true
  esbuild: true

onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - prettier@3.9.4
  - vite@8.1.2
